name: Publish media release

on:
  push:
    paths:
      - 'payloads/**'
      - '.github/workflows/publish-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-media
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payloads and upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out media
          shopt -s nullglob
          for first in payloads/*.mp4.b64-00; do
            stem="${first%-00}"
            cat "$stem"-* > "$stem"
          done
          for f in payloads/*.mp4.b64; do
            base="$(basename "$f" .b64)"
            if base64 -d "$f" > "out/$base" 2>/tmp/b64.err; then
              echo "Decoded $base ($(wc -c < "out/$base") bytes)"
            else
              echo "Skipping incomplete or invalid $f"
              cat /tmp/b64.err || true
              rm -f "out/$base"
            fi
          done
          python3 - <<'PY'
          import os, sys
          expected = {
            'short_1.mp4': 7637861,
            'short_2.mp4': 10897132,
            'short_3.mp4': 8018112,
            'short_4.mp4': 12270702,
            'short_5.mp4': 14059170,
            'short_6.mp4': 4302938,
            'short_7.mp4': 11097035,
            'short_8.mp4': 2415260,
          }
          out = 'out'
          for name in os.listdir(out):
            if name not in expected:
              print(f'Unexpected {name}; removing'); os.remove(os.path.join(out, name))
          ok = False
          for name, exp in expected.items():
            path = os.path.join(out, name)
            if not os.path.exists(path):
              print(f'Missing {name}')
              continue
            got = os.path.getsize(path)
            if got != exp:
              print(f'Size mismatch {name}: got {got} expected {exp}; removing')
              os.remove(path)
            else:
              print(f'Size OK {name}: {got}')
              ok = True
          if not ok:
              print('No valid media to publish')
              sys.exit(0)
          PY
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "No complete media to publish yet"
            exit 0
          fi
          TAG=v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gh release create "$TAG" --title "Missed in GTA 6 Shorts media" --notes "Public MP4s for scheduling Missed in GTA 6 YouTube Shorts. Fan page, not affiliated with Rockstar Games. Trailer footage copyright Rockstar Games."
          fi
          gh release upload "$TAG" out/* --clobber
          # Slim orphan branch so jsDelivr stays under its 50MB package limit.
          # Only Shorts that are still queued in Buffer go on the cdn branch.
          # short_1, 3, 5 were published Nov 18; short_6 was cancelled. All stay in release v1.
          # short_7 failed on Nov 19 (YouTube daily limit) and may be retried.
          # short_8 is the Nov 19 launch Short.
          CDN_FILES="short_2.mp4 short_4.mp4 short_7.mp4 short_8.mp4"
          work=$(mktemp -d)
          for f in $CDN_FILES; do
            if [ -f "out/$f" ]; then
              cp "out/$f" "$work/"
            elif gh release download "$TAG" -p "$f" -D "$work"; then
              echo "Fetched $f from release $TAG"
            else
              echo "WARNING: missing $f for CDN branch"
            fi
          done
          cat > "$work/README.md" <<'EOF'
          Missed in GTA 6 Shorts media (fan page, not affiliated with Rockstar Games).
          EOF
          du -sh "$work"
          git -C "$work" init
          git -C "$work" checkout -b cdn
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add .
          git -C "$work" commit -m "CDN-only Shorts MP4s"
          git -C "$work" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/mentallytrillest/missedingta6-media.git"
          git -C "$work" push -f origin cdn
          ls -la out
          echo "jsDelivr URLs:"
          for f in "$work"/*.mp4; do
            echo "https://cdn.jsdelivr.net/gh/mentallytrillest/missedingta6-media@cdn/$(basename "$f")"
          done
